name: Validate Contracts
on:
  push:
    paths:
      [
        "docs/contracts/**",
        "web/lib/schemas/**",
        "web/lib/auth/**",
        "web/lib/rate-limit/**",
        "web/package.json",
        "web/pnpm-lock.yaml",
        "scripts/**",
        ".github/workflows/contracts.yml",
      ]
  pull_request:
    paths:
      [
        "docs/contracts/**",
        "web/lib/schemas/**",
        "web/lib/auth/**",
        "web/lib/rate-limit/**",
        "web/package.json",
        "web/pnpm-lock.yaml",
        "scripts/**",
        ".github/workflows/contracts.yml",
      ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22 es el mínimo para `--experimental-strip-types` (el test importa .ts).
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: node scripts/validate-contracts.js
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # Valida los mismos fixtures contra los esquemas Zod del servidor.
      - run: pnpm test:contracts
        working-directory: web
