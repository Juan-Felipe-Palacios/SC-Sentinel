name: Validate Contracts
on:
  push:
    paths: ["docs/contracts/**", "scripts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["docs/contracts/**", "scripts/**", ".github/workflows/contracts.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-contracts.js
