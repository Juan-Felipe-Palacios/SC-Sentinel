name: Rust CI
on:
  push:
    paths: ["agent/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["agent/**", ".github/workflows/rust.yml"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      # La feature `live` requiere cabeceras de libpcap para compilar.
      - name: Instalar libpcap (Linux, feature live)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Evita bit-rot de la captura real: sin esto, `live` solo se compila a mano.
      - name: Check feature live
        if: runner.os == 'Linux'
        run: cargo check -p sc-capture --features live
      - run: cargo audit
      - run: cargo deny check licenses
      - run: cargo build --release
