<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1971c2"/>
    </marker>
  </defs>

  <rect width="1400" height="950" fill="#ffffff"/>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" font-size="28" font-weight="bold" fill="#1e1e1e">SC-Sentinel — Mapa del proyecto</text>

  <!-- External providers -->
  <rect x="80" y="70" width="300" height="70" rx="8" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
  <text x="230" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e1e1e">Proveedores IA</text>
  <text x="230" y="122" text-anchor="middle" font-size="13" fill="#495057">Gemini · Groq · OpenRouter</text>

  <rect x="470" y="70" width="270" height="70" rx="8" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
  <text x="605" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e1e1e">Webhooks de alerta</text>
  <text x="605" y="122" text-anchor="middle" font-size="13" fill="#495057">Slack · Discord · URL propia</text>

  <rect x="830" y="70" width="250" height="70" rx="8" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
  <text x="955" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e1e1e">GitHub</text>
  <text x="955" y="122" text-anchor="middle" font-size="13" fill="#495057">CI · tags · releases</text>

  <!-- Vercel container -->
  <rect x="80" y="200" width="660" height="300" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
  <text x="100" y="228" font-size="17" font-weight="bold" fill="#2f9e44">Vercel (Hobby) — Next.js 15 · producción</text>

  <!-- Web boxes -->
  <rect x="110" y="255" width="280" height="70" rx="6" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
  <text x="250" y="283" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e1e1e">Web</text>
  <text x="250" y="305" text-anchor="middle" font-size="12" fill="#495057">landing · dashboard · demo</text>

  <rect x="430" y="255" width="280" height="70" rx="6" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
  <text x="570" y="283" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e1e1e">API routes</text>
  <text x="570" y="305" text-anchor="middle" font-size="12" fill="#495057">ingest · query · auth · alerts</text>

  <rect x="110" y="365" width="280" height="70" rx="6" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
  <text x="250" y="393" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e1e1e">Lib web</text>
  <text x="250" y="415" text-anchor="middle" font-size="12" fill="#495057">Zod · CSP · auth · Drizzle</text>

  <rect x="430" y="365" width="280" height="70" rx="6" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
  <text x="570" y="393" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e1e1e">IA por lotes + chat</text>
  <text x="570" y="415" text-anchor="middle" font-size="12" fill="#495057">analyze · cron · trust</text>

  <!-- Neon -->
  <rect x="800" y="200" width="240" height="150" rx="8" fill="#ffd43b" stroke="#e67700" stroke-width="2"/>
  <text x="920" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e1e1e">Neon Postgres</text>
  <text x="920" y="265" text-anchor="middle" font-size="13" fill="#495057">ventanas · alertas</text>
  <text x="920" y="285" text-anchor="middle" font-size="13" fill="#495057">device · insights</text>

  <!-- Docs -->
  <rect x="1090" y="200" width="270" height="240" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/>
  <text x="1225" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e1e1e">docs · scripts · contracts</text>
  <text x="1225" y="275" text-anchor="middle" font-size="13" fill="#495057">ADR · runbooks · evidence</text>
  <text x="1225" y="300" text-anchor="middle" font-size="13" fill="#495057">JSON Schema + Zod + serde</text>
  <text x="1225" y="325" text-anchor="middle" font-size="13" fill="#495057">install · verify · deploy</text>

  <!-- Windows node container -->
  <rect x="80" y="560" width="660" height="350" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
  <text x="100" y="588" font-size="17" font-weight="bold" fill="#1971c2">Nodo Windows — agente Rust (servicio local)</text>

  <!-- Agent boxes -->
  <rect x="110" y="620" width="270" height="64" rx="6" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
  <text x="245" y="647" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e1e1e">sc-capture</text>
  <text x="245" y="669" text-anchor="middle" font-size="12" fill="#495057">captura pasiva (SPAN/TAP)</text>

  <rect x="440" y="620" width="270" height="64" rx="6" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
  <text x="575" y="647" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e1e1e">sc-collector → sc-aggregate</text>
  <text x="575" y="669" text-anchor="middle" font-size="12" fill="#495057">ventanas de 5 min</text>

  <rect x="440" y="720" width="270" height="64" rx="6" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
  <text x="575" y="747" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e1e1e">sc-detect</text>
  <text x="575" y="769" text-anchor="middle" font-size="12" fill="#495057">reglas + modelo de normalidad</text>

  <rect x="110" y="720" width="270" height="64" rx="6" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
  <text x="245" y="747" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e1e1e">spool SQLite → sc-sync</text>
  <text x="245" y="769" text-anchor="middle" font-size="12" fill="#495057">drenaje HTTPS</text>

  <rect x="110" y="820" width="270" height="64" rx="6" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
  <text x="245" y="847" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e1e1e">sc-gui</text>
  <text x="245" y="869" text-anchor="middle" font-size="12" fill="#495057">bandeja · Stage 0 (instrumentación)</text>

  <rect x="440" y="820" width="270" height="64" rx="6" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
  <text x="575" y="847" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e1e1e">sc-agent · config · telemetry</text>
  <text x="575" y="869" text-anchor="middle" font-size="12" fill="#495057">servicio Windows + SCM</text>

  <!-- Arrows -->
  <!-- sync HTTPS -->
  <line x1="710" y1="652" x2="740" y2="652" stroke="#1971c2" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 740 652 L 740 480 L 740 300" stroke="#1971c2" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="780" y="500" font-size="12" fill="#1971c2" font-style="italic">sync HTTPS (30 min)</text>

  <!-- SQL to Neon -->
  <line x1="710" y1="290" x2="795" y2="275" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="740" y="270" font-size="11" fill="#495057">SQL</text>

  <!-- Alerts to webhooks -->
  <line x1="570" y1="255" x2="570" y2="145" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570" y="180" font-size="11" fill="#495057" text-anchor="middle">alertas</text>

  <!-- LLM to providers -->
  <path d="M 430 400 L 300 400 L 300 145" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="300" y="350" font-size="11" fill="#495057" text-anchor="middle" transform="rotate(-90, 300, 350)">LLM</text>

  <!-- GitHub deploy to Vercel -->
  <path d="M 830 105 L 750 105 L 750 200" stroke="#495057" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="790" y="160" font-size="11" fill="#495057" text-anchor="middle">push main → deploy</text>

  <!-- GitHub release to agent -->
  <path d="M 955 140 L 955 560 L 750 560" stroke="#495057" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="955" y="400" font-size="11" fill="#495057" text-anchor="middle" transform="rotate(90, 955, 400)">release ZIP</text>

  <!-- Internal arrows in agent -->
  <line x1="380" y1="652" x2="435" y2="652" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="575" y1="684" x2="575" y2="715" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="752" x2="385" y2="752" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="245" y1="784" x2="245" y2="815" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="852" x2="435" y2="852" stroke="#495057" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
</svg>
