[package]
name = "sc-agent"
description = "Daemon headless del agente SCNet (M0: esqueleto, solo --version)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../../LICENSE"
authors.workspace = true

[[bin]]
name = "sc-agent"
path = "src/main.rs"

[dependencies]
sc-capture = { path = "../sc-capture" }
sc-aggregate = { path = "../sc-aggregate" }
sc-sync = { path = "../sc-sync" }
sc-core = { path = "../sc-core" }
sc-geo = { path = "../sc-geo" }
sc-telemetry = { path = "../sc-telemetry" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
