[package]
name = "sc-sync"
description = "Spool SQLite + cliente /api/ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../../LICENSE"
authors.workspace = true

[features]
zstd = ["dep:zstd"]

[dependencies]
sc-core = { path = "../sc-core" }
sc-telemetry = { path = "../sc-telemetry" }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
backoff = { version = "0.4", features = ["tokio"] }
secrecy = "0.8"
ulid = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = { workspace = true }
tracing = "0.1"
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
sha2 = "0.10"
hex = "0.4"
zstd = { version = "0.13", optional = true }

[dev-dependencies]
tempfile = "3.12"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
