[package]
name = "sc-collector"
description = "Colector pasivo de flujos NetFlow v5/v9 e IPFIX (M4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../../LICENSE"
authors.workspace = true

[dependencies]
sc-core = { path = "../sc-core" }
sc-capture = { path = "../sc-capture" }
tokio = { workspace = true, features = ["net", "sync", "rt", "time"] }
tracing = "0.1"
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
proptest = "1.5"

# Emisor sintético para demos: manda v5+v9+IPFIX a una instancia de prueba.
[[bin]]
name = "sc-collector-testsend"
path = "src/bin/sc-collector-testsend.rs"

[[bench]]
name = "collector_throughput"
harness = false
