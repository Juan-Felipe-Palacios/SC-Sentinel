[package]
name = "sc-gui"
description = "GUI de administración del agente SC-Sentinel (bandeja + estado)"
version.workspace = true
edition.workspace = true
# El agente mantiene el MSRV 1.75 del workspace; esta GUI no puede: `eframe`
# 0.27 (stack aprobado para M5 §19) exige 1.76. Se documenta en ADR-0017.
rust-version = "1.76"
license-file = "../../../LICENSE"
authors.workspace = true

[[bin]]
name = "sc-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.27"
# Bandeja del sistema Windows (menú Mostrar/Enrolar/Salir e icono con overlays).
tray-icon = "0.15"
# F3: poll al endpoint loopback /status del agente.
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# F4: lectura READ-ONLY del spool SQLite del agente + descompresión del payload.
rusqlite = { version = "0.41", features = ["bundled"] }
flate2 = "1.0"

[target.'cfg(windows)'.dependencies]
# Estado real del servicio por SCM (nunca parseando `sc.exe`).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Services"] }
