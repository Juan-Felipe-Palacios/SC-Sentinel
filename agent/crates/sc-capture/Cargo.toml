[package]
name = "sc-capture"
description = "Captura de paquetes (Windows: pcap; M0: esqueleto sin deps)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../../LICENSE"
authors.workspace = true

[dependencies]
sc-core = { path = "../sc-core" }
thiserror = { workspace = true }
tracing = "0.1"
etherparse = "0.20"
pcap-file = "3.0.0-rc1"
tokio = { version = "1.40", features = ["sync", "rt", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time"] }
insta = { version = "1.40", features = ["yaml"] }
proptest = "1.5"
hex = "0.4"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
assert_matches = "1.5"
tempfile = "3.12"
