# Raíz del workspace: web/ es el único proyecto del repositorio.
#
# `overrides` vive aquí porque el campo `pnpm` de package.json dejó de leerse
# (pnpm 11 lo ignora y pnpm 10.5+ lee este archivo). El valor no cambia:
# postcss >= 8.5.23.
packages:
  - '.'

# `allowBuilds`: de los cinco build scripts del árbol, sólo esbuild necesita su
# postinstall (binario nativo por plataforma; cubre sus tres versiones).
# @google/genai y protobufjs quedan denegados explícitamente: no aportan binario
# y funcionaban sin postinstall. La clave existe desde pnpm 10.26.0, así que el
# CI, que fija pnpm 10.34.9, también la lee.
allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false

overrides:
  postcss: '>=8.5.23'
